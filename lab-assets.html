<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koo Lab 자산관리</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2335; --surface3:#242840;
  --border:#2a2f45; --border2:#343b56;
  --accent:#4f8ef7; --accent2:#7c5cbf;
  --green:#3ecf8e; --orange:#f59e0b; --red:#ef4444; --purple:#a78bfa;
  --text:#e2e8f0; --text2:#8892a4; --text3:#4a5568;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;}
.logo-icon{width:26px;height:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.header-right{display:flex;align-items:center;gap:10px;}
.hpill{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:3px 10px;font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;}
.hpill b{color:var(--accent);}
.hpill.green b{color:var(--green);}
.hpill.orange b{color:var(--orange);}
.hpill.red b{color:var(--red);}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 56px);}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0;}
.sidebar-section{margin-bottom:20px;}
.sidebar-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:0 16px;margin-bottom:8px;}
.sidebar-item{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;}
.sidebar-item:hover{background:var(--surface2);color:var(--text);}
.sidebar-item.active{background:var(--surface2);border-left-color:var(--accent);color:var(--accent);}
.sidebar-item-left{display:flex;align-items:center;gap:8px;font-size:12px;}
.sidebar-count{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--text3);background:var(--surface3);border-radius:10px;padding:1px 6px;}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

/* TOP BAR */
.topbar{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;flex-shrink:0;}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px;}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 10px 8px 32px;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border-color .2s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;}
.fsel{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text2);font-family:inherit;font-size:12px;outline:none;cursor:pointer;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .18s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#6a9ef8;transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:5px 9px;font-size:11px;border-radius:5px;}
.btn-danger{background:var(--red);color:#fff;}
.view-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.vbtn{padding:7px 11px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;transition:all .15s;}
.vbtn.active{background:var(--surface3);color:var(--accent);}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;}

/* GRID */
.content{padding:16px 20px;flex:1;}
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.assets-grid.hidden{display:none;}

.acard{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .18s;cursor:pointer;}
.acard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,142,247,.1);}
.acard-thumb{width:100%;height:130px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;overflow:hidden;}
.acard-thumb img{width:100%;height:100%;object-fit:cover;}
.acard-body{padding:12px;}
.acard-id{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-bottom:3px;}
.acard-name{font-weight:600;font-size:13px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acard-model{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acard-meta{display:flex;flex-direction:column;gap:3px;}
.acard-row{display:flex;justify-content:space-between;align-items:center;}
.acard-key{font-size:10px;color:var(--text3);}
.acard-val{font-size:11px;color:var(--text2);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.acard-footer{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:5px;justify-content:flex-end;}

/* TABLE */
.table-wrap{display:none;overflow-x:auto;}
.table-wrap.active{display:block;}
table{width:100%;border-collapse:collapse;min-width:900px;}
thead tr{background:var(--surface2);position:sticky;top:0;z-index:5;}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;}
tr:hover td{background:var(--surface2);}
tr:last-child td{border-bottom:none;}
.td-thumb{width:30px;height:30px;background:var(--surface2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;overflow:hidden;}
.td-thumb img{width:100%;height:100%;object-fit:cover;}
.td-with-img{display:flex;align-items:center;gap:8px;}
.td-sub{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
.td-actions{display:flex;gap:4px;}
.mono{font-family:'IBM Plex Mono',monospace;color:var(--text2);}

/* STATUS BADGES */
.sbadge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.3px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.s-정상{background:rgba(62,207,142,.12);color:var(--green);border:1px solid rgba(62,207,142,.25);}
.s-수리중{background:rgba(245,158,11,.12);color:var(--orange);border:1px solid rgba(245,158,11,.25);}
.s-분실{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.s-폐기{background:rgba(100,116,139,.12);color:#64748b;border:1px solid rgba(100,116,139,.25);}
.s-default{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.25);}

/* APPROVAL BADGE */
.abadge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.ab-Approved{background:rgba(62,207,142,.1);color:var(--green);}
.ab-Pending{background:rgba(245,158,11,.1);color:var(--orange);}

/* CARD IN SIDEBAR */
.scard-mini{margin:0 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;}
.scm-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.scm-key{font-size:10px;color:var(--text3);}
.scm-val{font-size:14px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.scm-val.blue{color:var(--accent);}
.scm-val.green{color:var(--green);}
.scm-val.orange{color:var(--orange);}
.scm-val.red{color:var(--red);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:200;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:680px;margin:auto;animation:su .2s ease;}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-title{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

.form-section{margin-bottom:20px;}
.form-section-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--text3);}
textarea{resize:vertical;min-height:60px;}
select option{background:var(--surface2);}

.upload-zone{grid-column:1/-1;border:1.5px dashed var(--border);border-radius:8px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2);}
.upload-zone:hover{border-color:var(--accent);background:rgba(79,142,247,.04);}
.upload-zone p{font-size:11px;color:var(--text2);margin-top:6px;}
.upload-zone span{font-size:10px;color:var(--text3);}
.upload-preview{width:70px;height:70px;object-fit:cover;border-radius:6px;margin-bottom:6px;}

/* DELETE CONFIRM */
.confirm-body{text-align:center;padding:28px;}
.confirm-icon{font-size:36px;margin-bottom:10px;}
.confirm-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.confirm-desc{font-size:12px;color:var(--text2);line-height:1.6;}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);transform:translateY(60px);opacity:0;transition:all .3s;z-index:300;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:rgba(62,207,142,.35);}
.toast.success .tdot{background:var(--green);}
.toast.error{border-color:rgba(239,68,68,.35);}
.toast.error .tdot{background:var(--red);}
.tdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

.empty{text-align:center;padding:50px 20px;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:10px;}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);z-index:999;transform:scaleX(0);transform-origin:left;}
.loading-bar.run{animation:lb 1.1s infinite;}
@keyframes lb{0%{transform:scaleX(0) translateX(0)}50%{transform:scaleX(.6) translateX(50%)}100%{transform:scaleX(0) translateX(300%)}}

/* DATA ISSUES */
.issue-tag{display:inline-block;font-size:9px;background:rgba(245,158,11,.1);color:var(--orange);border:1px solid rgba(245,158,11,.2);border-radius:3px;padding:1px 5px;margin-top:3px;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

@media(max-width:900px){.sidebar{display:none;}.form-grid{grid-template-columns:1fr;}.form-grid.cols3{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<div class="loading-bar" id="lb"></div>

<header>
  <div class="logo">
    <div class="logo-icon">🔬</div>
    Koo Lab 자산관리
  </div>
  <div class="header-right">
    <div class="hpill">전체 <b id="h-total">0</b></div>
    <div class="hpill green">정상 <b id="h-ok">0</b></div>
    <div class="hpill orange">수리/점검 <b id="h-rep">0</b></div>
    <div class="hpill red">분실 <b id="h-lost">0</b></div>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="scard-mini">
        <div class="scm-row"><span class="scm-key">전체 자산</span><span class="scm-val blue" id="sm-total">0</span></div>
        <div class="scm-row"><span class="scm-key">총 자산가치</span><span class="scm-val" style="font-size:12px;color:var(--text2)" id="sm-val">—</span></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">상태 필터</div>
      <div class="sidebar-item active" data-filter="status" data-val="" onclick="setSideFilter(this)">
        <div class="sidebar-item-left">🗂 전체</div>
        <span class="sidebar-count" id="sf-all">0</span>
      </div>
      <div class="sidebar-item" data-filter="status" data-val="정상" onclick="setSideFilter(this)">
        <div class="sidebar-item-left"><span style="color:var(--green)">●</span> 정상</div>
        <span class="sidebar-count" id="sf-ok">0</span>
      </div>
      <div class="sidebar-item" data-filter="status" data-val="수리중" onclick="setSideFilter(this)">
        <div class="sidebar-item-left"><span style="color:var(--orange)">●</span> 수리중</div>
        <span class="sidebar-count" id="sf-rep">0</span>
      </div>
      <div class="sidebar-item" data-filter="status" data-val="분실" onclick="setSideFilter(this)">
        <div class="sidebar-item-left"><span style="color:var(--red)">●</span> 분실</div>
        <span class="sidebar-count" id="sf-lost">0</span>
      </div>
      <div class="sidebar-item" data-filter="status" data-val="폐기" onclick="setSideFilter(this)">
        <div class="sidebar-item-left"><span style="color:var(--text3)">●</span> 폐기</div>
        <span class="sidebar-count" id="sf-disc">0</span>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">카테고리</div>
      <div class="sidebar-item active-cat" data-filter="cat" data-val="" onclick="setSideFilter(this)">
        <div class="sidebar-item-left">📦 전체</div>
      </div>
      <div class="sidebar-item" data-filter="cat" data-val="1.Equipment for experiment" onclick="setSideFilter(this)">
        <div class="sidebar-item-left">🔬 실험장비</div>
      </div>
      <div class="sidebar-item" data-filter="cat" data-val="2.Servers & Personal Computers" onclick="setSideFilter(this)">
        <div class="sidebar-item-left">💻 컴퓨터/서버</div>
      </div>
      <div class="sidebar-item" data-filter="cat" data-val="3.Software" onclick="setSideFilter(this)">
        <div class="sidebar-item-left">💾 소프트웨어</div>
      </div>
      <div class="sidebar-item" data-filter="cat" data-val="4.Miscellaneous" onclick="setSideFilter(this)">
        <div class="sidebar-item-left">🗃 기타</div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">보관위치</div>
      <div id="loc-filters"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="q" placeholder="자산명, 모델명, 담당자, Asset ID...">
      </div>
      <select class="fsel" id="managerFilter">
        <option value="">담당자 전체</option>
      </select>
      <select class="fsel" id="approvalFilter">
        <option value="">승인 전체</option>
        <option value="Approved">Approved</option>
        <option value="Pending">Pending</option>
      </select>
      <div class="topbar-right">
        <div class="view-toggle">
          <button class="vbtn active" id="vgrid" title="카드">⊞</button>
          <button class="vbtn" id="vlist" title="테이블">☰</button>
        </div>
        <button class="btn btn-primary" onclick="openAdd()">＋ 자산 추가</button>
      </div>
    </div>

    <div class="content">
      <div class="assets-grid" id="gridView"></div>
      <div class="table-wrap" id="tableView">
        <table>
          <thead><tr>
            <th>자산 ID</th><th>물품명 / 모델</th><th>상태</th>
            <th>카테고리</th><th>담당자</th><th>위치</th>
            <th>S/N</th><th>병원코드</th><th>구입시기</th><th>금액</th><th>소유권</th><th>승인</th><th>관리</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ===== ADD / EDIT MODAL ===== -->
<div class="overlay" id="assetModal">
<div class="modal">
  <div class="modal-head">
    <div class="modal-title" id="mTitle">자산 추가</div>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <!-- 기본 정보 -->
    <div class="form-section">
      <div class="form-section-title">기본 정보</div>
      <div class="form-grid">
        <div class="fg"><label>Asset ID</label><input id="f-id" placeholder="KOOLAB-XXXX (자동생성)" readonly style="color:var(--text3)"></div>
        <div class="fg"><label>데이터 상태</label><input id="f-dstatus" placeholder="정상" readonly style="color:var(--text3)"></div>
        <div class="fg"><label>물품명 *</label><input id="f-name" placeholder="예: NAS 저장장치"></div>
        <div class="fg"><label>모델명</label><input id="f-model" placeholder="예: DS923+"></div>
        <div class="fg"><label>제조사</label><input id="f-maker" placeholder="예: Synology"></div>
        <div class="fg"><label>물품번호 (S/N)</label><input id="f-sn" placeholder="시리얼 넘버"></div>
        <div class="fg"><label>병원 자산코드</label><input id="f-hosp" placeholder="예: C0029676"></div>
        <div class="fg"><label>표준물품명(제안)</label><input id="f-std" placeholder="자동: 제조사_물품명_모델명"></div>
      </div>
    </div>
    <!-- 분류 & 상태 -->
    <div class="form-section">
      <div class="form-section-title">분류 및 상태</div>
      <div class="form-grid cols3">
        <div class="fg"><label>자산분류</label>
          <select id="f-cat">
            <option value="1.Equipment for experiment">🔬 실험장비</option>
            <option value="2.Servers & Personal Computers">💻 컴퓨터/서버</option>
            <option value="3.Software">💾 소프트웨어</option>
            <option value="4.Miscellaneous">🗃 기타</option>
          </select>
        </div>
        <div class="fg"><label>상태</label>
          <select id="f-status">
            <option value="정상">정상</option>
            <option value="수리중">수리중</option>
            <option value="폐기">폐기</option>
            <option value="분실">분실</option>
          </select>
        </div>
        <div class="fg"><label>소유권</label>
          <select id="f-own">
            <option value="공용">공용</option>
            <option value="개인">개인</option>
            <option value="미확인">미확인</option>

// ============================================================
//  FILTERS
// ============================================================
function getFiltered() {
  const q = document.getElementById('q').value.toLowerCase();
  const mgr = document.getElementById('managerFilter').value;
  const appr = document.getElementById('approvalFilter').value;
  return assets.filter(a => {
    const mq = !q || [a.id,a.name,a.model,a.maker,a.manager,a.sn,a.hosp].some(v=>(v||'').toLowerCase().includes(q));
    const ms = !sideStatus || normalizeStatus(a.status)===sideStatus;
    const mc = !sideCat || a.cat===sideCat;
    const ml = !sideLoc || a.location===sideLoc;
    
    const ma = !appr || a.approval===appr;
    const mm = !mgr || a.manager===mgr;
    return mq&&ms&&mc&&ml&&mm&&ma;
  });
}
function normalizeStatus(s){if(!s||s.startsWith('정상'))return '정상';if(s.includes('수리'))return '수리중';if(s.includes('분실')||s.includes('🚨'))return '분실';if(s.includes('폐기'))return '폐기';return s;}
function statusClass(s){const n=normalizeStatus(s);return `s-${n}`;}
function statusLabel(s){return normalizeStatus(s);}

function setSideFilter(el){
  const f=el.dataset.filter, v=el.dataset.val;
  if(f==='status'){
    sideStatus=v;
    document.querySelectorAll('[data-filter="status"]').forEach(x=>x.classList.remove('active'));
  } else if(f==='cat'){
    sideCat=v;
    document.querySelectorAll('[data-filter="cat"]').forEach(x=>x.classList.remove('active'));
  } else if(f==='loc'){
    sideLoc=v;
    document.querySelectorAll('[data-filter="loc"]').forEach(x=>x.classList.remove('active'));
  }
  el.classList.add('active');
  render();
}

// ============================================================
//  STATS
// ============================================================
function updateStats(){
  const t=assets.length;
  const ok=assets.filter(a=>normalizeStatus(a.status)==='정상').length;
  const rep=assets.filter(a=>normalizeStatus(a.status)==='수리중').length;
  const lost=assets.filter(a=>normalizeStatus(a.status)==='분실').length;
  const disc=assets.filter(a=>normalizeStatus(a.status)==='폐기').length;
  const val=assets.reduce((s,a)=>s+(Number(a.price)||0),0);
  ['h-total','sm-total'].forEach(id=>document.getElementById(id).textContent=t);
  document.getElementById('h-ok').textContent=ok;
  document.getElementById('h-rep').textContent=rep;
  document.getElementById('h-lost').textContent=lost;
  document.getElementById('sf-all').textContent=t;
  document.getElementById('sf-ok').textContent=ok;
  document.getElementById('sf-rep').textContent=rep;
  document.getElementById('sf-lost').textContent=lost;
  document.getElementById('sf-disc').textContent=disc;
  document.getElementById('sm-val').textContent=val>0?(val/10000).toFixed(0)+'만원':'—';

  // manager dropdown
  const curMgr = document.getElementById('managerFilter').value;
  const mgrs = [...new Set(assets.map(a=>a.manager).filter(Boolean))].sort();
  const mf = document.getElementById('managerFilter');
  mf.innerHTML = '<option value="">담당자 전체</option>'
    + mgrs.map(m=>`<option value="${m}" ${curMgr===m?'selected':''}>${m}</option>`).join('');

  // location filters
  const locs=[...new Set(assets.map(a=>a.location).filter(Boolean))].sort();
  const lf=document.getElementById('loc-filters');
  const cur=sideLoc;
  lf.innerHTML='<div class="sidebar-item '+(cur?'':'active')+'" data-filter="loc" data-val="" onclick="setSideFilter(this)"><div class="sidebar-item-left">📍 전체</div></div>'
    +locs.map(l=>`<div class="sidebar-item ${cur===l?'active':''}" data-filter="loc" data-val="${l}" onclick="setSideFilter(this)"><div class="sidebar-item-left" style="font-size:11px">${l}</div></div>`).join('');
}

function thumbHtml(a, size=38){
  if(a.imageUrl) return `<img src="${a.imageUrl}" alt="">`;
  return `<span style="font-size:${size}px">${EMOJIS[a.cat]||'📦'}</span>`;
}
function fmtPrice(p){return p?Number(p).toLocaleString('ko-KR')+'원':'—';}
function fmtDate(d){return d||'—';}

function renderGrid(){
  const f=getFiltered();
  const g=document.getElementById('gridView');
  if(!f.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📭</div><p>검색 결과가 없습니다</p></div>';return;}
  g.innerHTML=f.map(a=>`
    <div class="acard" onclick="openEdit('${a.id}')">
      <div class="acard-thumb">${thumbHtml(a)}
        <span class="sbadge ${statusClass(a.status)}" style="position:absolute;top:7px;right:7px">${statusLabel(a.status)}</span>
        ${a.approval==='Pending'?'<span class="abadge ab-Pending" style="position:absolute;top:7px;left:7px">Pending</span>':''}
      </div>
      <div class="acard-body">
        <div class="acard-id">${a.id}</div>
        <div class="acard-name">${a.name}</div>
        <div class="acard-model">${a.model||'모델 미기재'}</div>
        <div class="acard-meta">
          <div class="acard-row"><span class="acard-key">제조사</span><span class="acard-val">${a.maker||'—'}</span></div>
          <div class="acard-row"><span class="acard-key">담당자</span><span class="acard-val">${a.manager||'—'}</span></div>
          <div class="acard-row"><span class="acard-key">위치</span><span class="acard-val">${a.location||'—'}</span></div>
          <div class="acard-row"><span class="acard-key">금액</span><span class="acard-val">${fmtPrice(a.price)}</span></div>
        </div>
        ${a.issues?`<div class="issue-tag">⚠ ${a.issues.split(',')[0].trim()}</div>`:''}
      </div>
      <div class="acard-footer" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="openEdit('${a.id}')">✏️ 수정</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:rgba(239,68,68,.3)" onclick="openDel('${a.id}')">🗑️</button>
      </div>
    </div>`).join('');
}

function renderTable(){
  const f=getFiltered();
  const b=document.getElementById('tableBody');
  if(!f.length){b.innerHTML='<tr><td colspan="13" class="empty" style="padding:36px">검색 결과 없음</td></tr>';return;}
  b.innerHTML=f.map(a=>`
    <tr>
      <td><span class="mono" style="font-size:11px">${a.id}</span></td>
      <td><div class="td-with-img">
        <div class="td-thumb">${a.imageUrl?`<img src="${a.imageUrl}">`:(EMOJIS[a.cat]||'📦')}</div>
        <div><div style="font-weight:500">${a.name}</div><div class="td-sub">${a.model||'—'} ${a.maker?'·'+a.maker:''}</div></div>
      </div></td>
      <td><span class="sbadge ${statusClass(a.status)}">${statusLabel(a.status)}</span></td>
      <td style="color:var(--text2);font-size:11px">${(a.cat||'').split('.')[1]||a.cat}</td>
      <td>${a.manager||'—'}</td>
      <td style="color:var(--text2);font-size:11px">${a.location||'—'}</td>
      <td class="mono" style="font-size:11px">${a.sn||'—'}</td>
      <td class="mono" style="font-size:11px;color:var(--purple)">${a.hosp||'—'}</td>
      <td class="mono" style="font-size:11px">${fmtDate(a.date)}</td>

        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="openDel('${a.id}')">삭제</button>
      </div></td>
    </tr>`).join('');
}

function render(){updateStats();currentView==='grid'?renderGrid():renderTable();}

['q','managerFilter','approvalFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));

async function saveAsset() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('물품명을 입력해주세요','error'); return; }
  const btn = document.getElementById('saveBtn');
  btn.innerHTML='<span class="spinner"></span> 저장 중...'; btn.disabled=true;

  try {
    let data = collectFormData();

    // 실제 모드: Drive 사진 업로드 → API 저장
    if (!DEMO_MODE) {
      if (selFile) {
        const base64 = selImgData.split(',')[1];
        const up = await apiPost({ action:'upload', filename:selFile.name, base64, mimeType:selFile.type });
        if (up.success) data.imageUrl = up.imageUrl;
        else showToast('사진 업로드 실패, 텍스트만 저장합니다','error');
      }
      let res;
      if (editingId) res = await apiPost({ action:'update', id:editingId, data });
      else           res = await apiPost({ action:'add', data });
      if (!res.success) { showToast(res.error||'저장 실패','error'); return; }
      await loadAssets();
      showToast(editingId?'수정되었습니다':'추가되었습니다','success');
    } else {
      // 데모 모드: 메모리에만 저장
      const d = { ...data, id: editingId||('DEMO-'+Date.now()) };
      if (editingId) { const idx=assets.findIndex(x=>x.id===editingId); assets[idx]={...assets[idx],...d}; }
      else assets.unshift(d);
      showToast(editingId?'수정되었습니다 (데모)':'추가되었습니다 (데모)','success');
      render();
    }
    closeModal();
  } catch(e) {
    showToast('오류: '+e.message,'error');
  } finally {
    btn.innerHTML='저장'; btn.disabled=false;
  }
}

// API 헬퍼
async function apiPost(body) {
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  return res.json();
}
async function apiGet(params) {
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url);
  return res.json();
}
async function loadAssets() {
  if (DEMO_MODE) { render(); return; }
  document.getElementById('lb').classList.add('run');
  try {
    const res = await apiGet({ action:'getAll' });
    if (res.success) { assets = res.data; render(); }
    else showToast(res.error||'불러오기 실패','error');
  } catch(e) { showToast('서버 연결 실패','error'); }
  finally { document.getElementById('lb').classList.remove('run'); }
}

// DELETE
function openDel(id){deletingId=id;const a=assets.find(x=>x.id===id);document.getElementById('del-desc').textContent=`"${a?.name}" 을(를) 삭제하면 복구할 수 없습니다.`;document.getElementById('deleteModal').classList.add('open');}
function closeDel(){document.getElementById('deleteModal').classList.remove('open');}
async function confirmDel(){
  if (!DEMO_MODE) {
    try {
      const res = await apiPost({ action:'delete', id:deletingId });
      if (!res.success) { showToast(res.error||'삭제 실패','error'); closeDel(); return; }
      await loadAssets();
    } catch(e) { showToast('오류: '+e.message,'error'); closeDel(); return; }
  } else {
    assets = assets.filter(x=>x.id!==deletingId);
    render();
  }
  closeDel();
  showToast('삭제되었습니다','success');
}

// OVERLAY CLICK CLOSE
['assetModal','deleteModal'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget){if(id==='assetModal')closeModal();else closeDel();}}));

function showToast(msg,type='success'){const t=document.getElementById('toast');document.getElementById('tmsg').textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove('show'),2500);}

if(DEMO_MODE){showToast('데모 모드 · Apps Script URL 설정 후 실제 저장 가능','success');render();}
else { loadAssets(); }
</script>
